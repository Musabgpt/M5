plugins {
    id 'com.android.application'
}
android {
    namespace 'com.musabgpt.m5'
    compileSdk 35
    defaultConfig {
        applicationId 'com.musabgpt.m5'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-native-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.nativepreview' }
    }
}
