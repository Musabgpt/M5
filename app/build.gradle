plugins {
    id 'com.android.application'
}
android {
    namespace 'com.musabgpt.m5'
    compileSdk 35
    defaultConfig {
        applicationId 'com.musabgpt.m5'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.11.0-termux-pty-agent'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.termux11' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
