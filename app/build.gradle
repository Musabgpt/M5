plugins {
    id 'com.android.application'
}
android {
    namespace 'com.musabgpt.m5'
    compileSdk 35
    defaultConfig {
        applicationId 'com.musabgpt.m5'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-native-fix'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.nativefix' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
